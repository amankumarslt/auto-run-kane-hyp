name: Kane AI Test Run

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    environment: USERNAME
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Generate LambdaTest config
        run: |
          mkdir -p .lambdatest
          cat > .lambdatest/config.yaml <<EOF
          project_id: ${{ secrets.PROJECT_ID }}
          folder_id: ${{ secrets.FOLDER_ID }}
          EOF

      - name: Run Kane AI Orchestrator
        env:
          LT_USERNAME: ${{ secrets.USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          LT_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          TARGET_TITLE: ${{ secrets.TARGET_TITLE }}
          TARGET_ENV_NAMES: ${{ secrets.TARGET_ENV_NAMES }}
        run: node flow.js
